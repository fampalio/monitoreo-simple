# /etc/systemd/system/n8n.service.d/monitoreo-archivos.conf — en el central,
# si n8n corre como servicio systemd (no en Docker).
# n8n restringe los nodos de archivo a ~/.n8n-files. El workflow de alertas lee
# /var/www/metrics y guarda su estado en /var/lib/metrics-alert. Se mantiene la
# ruta por defecto para no romper otros workflows: ajustala al home de tu n8n.
# Para sacarlo: borrar este archivo, systemctl daemon-reload, restart n8n.
[Service]
Environment="N8N_RESTRICT_FILE_ACCESS_TO=/home/n8n/.n8n-files;/var/www/metrics;/var/lib/metrics-alert"
