
# --- monitoreo-simple: usuario metrics ---
# Sólo recibe el push de los demás servidores. Qué ejecuta lo fija command= en
# /home/metrics/.ssh/authorized_keys (de root, metrics no lo puede tocar);
# esto es la segunda capa, por si alguna línea de ese archivo sale sin restrict.
Match User metrics
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PasswordAuthentication no
